services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: file:/data/studyflow.db
      CORS_ORIGIN: "*"
      REDIS_URL: redis://redis:6379
      OIDC_ISSUER: http://localhost:8080/realms/studyflow
      OIDC_AUDIENCE: studyflow-client
      OIDC_JWKS_URI: http://keycloak:8080/realms/studyflow/protocol/openid-connect/certs
    ports:
      - "4000:4000"
    volumes:
      - server-data:/data
    depends_on:
      - keycloak
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - server

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
        VITE_OIDC_AUTHORITY: http://localhost:8080/realms/studyflow
        VITE_OIDC_CLIENT_ID: studyflow-client
        VITE_OIDC_REDIRECT_URI: http://localhost:5173
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:5173
    ports:
      - "5173:80"
    depends_on:
      - keycloak
      - server

volumes:
  server-data:
  grafana-data:
