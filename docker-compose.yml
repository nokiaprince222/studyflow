services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: file:/data/studyflow.db
      CORS_ORIGIN: "*"
    ports:
      - "4000:4000"
    volumes:
      - server-data:/data

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  server-data:

