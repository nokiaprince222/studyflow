apiVersion: v1
kind: Namespace
metadata:
  name: studyflow
---
apiVersion: v1
kind: Secret
metadata:
  name: studyflow-secrets
  namespace: studyflow
type: Opaque
stringData:
  POSTGRES_PASSWORD: studyflow
  DATABASE_URL: postgresql://studyflow:studyflow@postgres:5432/studyflow?schema=public
  RABBITMQ_URL: amqp://studyflow:studyflow@rabbitmq:5672
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: studyflow-config
  namespace: studyflow
data:
  HOST: 0.0.0.0
  PORT: "4000"
  CORS_ORIGIN: "*"
  REDIS_URL: redis://redis:6379
  TASK_EVENTS_QUEUE: studyflow.task-events
  OIDC_ISSUER: ""
  OIDC_AUDIENCE: studyflow-client
  OIDC_JWKS_URI: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: studyflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: studyflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: studyflow
            - name: POSTGRES_USER
              value: studyflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: studyflow-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - studyflow
                - -d
                - studyflow
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: studyflow
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: studyflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: studyflow
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: studyflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: studyflow
            - name: RABBITMQ_DEFAULT_PASS
              value: studyflow
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - check_port_connectivity
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: studyflow
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studyflow-server
  namespace: studyflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studyflow-server
  template:
    metadata:
      labels:
        app: studyflow-server
    spec:
      containers:
        - name: server
          image: studyflow-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: studyflow-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: studyflow-secrets
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: studyflow-secrets
                  key: RABBITMQ_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: studyflow-server
  namespace: studyflow
spec:
  type: NodePort
  selector:
    app: studyflow-server
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30040
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studyflow-client
  namespace: studyflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studyflow-client
  template:
    metadata:
      labels:
        app: studyflow-client
    spec:
      containers:
        - name: client
          image: studyflow-client:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: studyflow-client
  namespace: studyflow
spec:
  type: NodePort
  selector:
    app: studyflow-client
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
